name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras || (uv venv --python 3.12 && uv pip install -e ".[dev]")

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # 守护测试与普通测试一起跑。它们是硬约束的可执行形式，
      # 挂了就是违反了 CLAUDE.md 里的硬约束，不是「测试没写好」。
      - name: Test (含 tests/guards)
        run: uv run pytest -q

  # 发版检查项 —— 不阻塞 PR，只在打 tag 时跑。
  # 见 A8 落实要求 ②：授权说明文案必须过英文母语审校。
  release-readiness:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: 发版检查（英文母语审校等）
        run: uv run pytest -q -m release
