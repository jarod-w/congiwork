name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cogniwork
          POSTGRES_PASSWORD: cogniwork
          POSTGRES_DB: cogniwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COGNIWORK_STORE_BACKEND: postgres
      COGNIWORK_DATABASE_URL: postgresql://cogniwork:cogniwork@localhost:5432/cogniwork
      COGNIWORK_REDIS_URL: redis://localhost:6379/0
      COGNIWORK_JWT_SECRET: ci-jwt-secret-not-for-production
      COGNIWORK_IP_HASH_PEPPER: ci-ip-pepper-not-for-production
      COGNIWORK_OAUTH_STUB: "true"
      COGNIWORK_VAULT_MASTER_KEY: ci-vault-master-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras || (uv venv --python 3.12 && uv pip install -e ".[dev]")

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrate
        run: uv run python -m cogniwork.migrate

      # 守护测试与普通测试一起跑。它们是硬约束的可执行形式，
      # 挂了就是违反了 CLAUDE.md 里的硬约束，不是「测试没写好」。
      - name: Test (含 tests/guards)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Typecheck + build
        run: pnpm --filter @cogniwork/web build

  # 发版检查项 —— 不阻塞 PR，只在打 tag 时跑。
  # 见 A8 落实要求 ②：授权说明文案必须过英文母语审校。
  release-readiness:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: 发版检查（英文母语审校等）
        run: uv run pytest -q -m release
