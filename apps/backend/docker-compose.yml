services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cogniwork
      POSTGRES_PASSWORD: cogniwork
      POSTGRES_DB: cogniwork
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogniwork"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
