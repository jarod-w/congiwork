[project]
name = "cogniwork-backend"
version = "0.0.1"
description = "CogniWork backend — FastAPI, Agent orchestration, Memory OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uuid7>=0.1.0",  # 提供 uuid_extensions 模块
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogniwork"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 发版检查项默认排除：开发期新增 Scope 时文案必然待审，
# 那时挡住合并没有意义。发版前用 `pytest -m release` 单独跑。
addopts = "-m 'not release'"
markers = [
    "release: 发版检查项，不阻塞 PR 合并（用 -m release 单独跑）",
    "integration: 需要 Postgres + Redis（CI 提供；本地无基础设施时自动 skip）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
